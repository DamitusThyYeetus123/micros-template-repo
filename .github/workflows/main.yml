on:
  workflow_dispatch:

jobs:
  build-micros:
    name: Build micros image from repo
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v31
    - run: nix build .
    - uses: actions/upload-artifact@v7.0.1
      with:
        path: result/iso/micros-image.iso
